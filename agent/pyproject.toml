[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "livekit-agents[groq,openai,silero]>=1.6.9",
    "livekit-plugins-ai-coustics~=0.2",
    "moss>=1.9.1",
    "python-dotenv",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "arize-phoenix",
    "arize-phoenix-otel",
    "openinference-instrumentation-openai",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.0.0",
    "sentry-sdk>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
# Phase 7f: only needed to run the offline Ragas evaluation harness
# (eval/run_ragas_eval.py). Kept as its own group since it pulls in a
# heavier dependency tree (datasets, langchain) that the live agent never
# needs. Install with: uv sync --group eval
eval = [
    "ragas",
    "datasets",
    "pandas",
    "langchain-openai",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "E402", "RUF006"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
