# Dashboard CI: lint and production build. `next build` also type-checks
# every TypeScript file, so a type error fails this job.
name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
