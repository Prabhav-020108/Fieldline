# docker-compose.edge.yml - FieldLine edge deployment with Native Host Ollama
# Run with: docker compose -f docker-compose.edge.yml up -d
# Zero external internet required; uses existing native Ollama on your PC (port 11434)

services:
  # Self-hosted LiveKit Server - handles WebRTC signaling and media locally
  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    command: --dev --bind 0.0.0.0
    restart: unless-stopped

  # FastAPI backend with SQLite (no Postgres or internet required)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:///./fieldline_edge.sqlite3"
      FIELDLINE_JWT_SECRET: "edge-dev-secret-change-in-production"
      MOSS_PROJECT_ID: "edge-moss"
      MOSS_PROJECT_KEY: "edge-moss-key"
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - edge_backend_data:/app
    depends_on:
      - livekit
    restart: unless-stopped

  # FieldLine voice agent - uses local models + your existing host Ollama
  agent:
    build: ./agent
    environment:
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      GROQ_API_KEY: "not-needed-in-edge-mode"
      MOSS_PROJECT_ID: "edge-moss"
      MOSS_PROJECT_KEY: "edge-moss-key"
      FIELDLINE_BACKEND_URL: "http://backend:8000"
      FIELDLINE_JWT_SECRET: "edge-dev-secret-change-in-production"
      # Points to your existing native Windows Ollama (zero duplicate disk space!)
      OLLAMA_BASE_URL: "http://host.docker.internal:11434/v1"
      OLLAMA_MODEL: "llama3.2:3b"
      PIPER_TTS_BASE_URL: "http://piper:8880/v1"
      FIELDLINE_EDGE_MODE: "1"
      FIELDLINE_CLOUD_DEPLOY: "0"
      WHISPER_MODEL_SIZE: "small"
      UV_CACHE_DIR: "/tmp/uv-cache"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      livekit:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  edge_backend_data:
