[project]
name = "fieldline-backend"
version = "1.0.0"
description = "FastAPI dispatch backend for FieldLine (multi-tenant jobs, inventory, safety procedures, audit log)"
requires-python = ">=3.10, <3.15"

# Same packages the README used to install with a bare `pip install ...`
# line -- now declared here so `uv sync` reproduces them exactly, locally
# and in CI.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27.0",
    "python-dotenv",
    "moss>=1.9.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "sentry-sdk>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",
]

[tool.uv]
# The backend is a set of flat scripts (main.py, models.py, ...), not an
# installable package -- tell uv to install only the dependencies.
package = false
# Same upstream workaround the agent uses: yarl 1.24.1 shipped without wheels
# for Python 3.11+. Remove once upstream fixes it.
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
